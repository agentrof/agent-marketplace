# Materialized by the software-engineering-team setup entry; {{test_command}} is
# replaced with the project's configured test command.
name: tests

on:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the configured test suite
        run: {{test_command}}

  dependency_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit locked dependencies for known advisories
        # Setup substitutes the per-stack audit commands over the lockfiles
        # (server and client). An advisory routes through the request entry
        # as a fix-atomic lockfile bump.
        run: {{audit_command}}
