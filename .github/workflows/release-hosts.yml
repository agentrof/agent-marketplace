name: release-hosts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  real-host-lifecycle:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install current host CLIs
        run: npm install --global @anthropic-ai/claude-code @openai/codex
      - name: Record host versions
        run: |
          claude --version
          codex --version
      - name: Run deterministic and public stable lifecycle gates
        run: |
          make public-release-check
          python3 tools/smoke_plugin_installs.py --channel checkout
