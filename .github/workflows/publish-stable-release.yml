name: Publish stable release

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  verify-release-candidate:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'release/stable' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - name: Prove the release head and merge topology
        env:
          RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE_SHA"
          merge_parents="$(git rev-list --parents -n 1 "$EXPECTED_MERGE_SHA")"
          set -- $merge_parents
          test "$#" -eq 3
          test "$1" = "$EXPECTED_MERGE_SHA"
          base_sha="$2"
          test "$3" = "$RELEASE_HEAD_SHA"
          metadata="$RUNNER_TEMP/release-metadata.json"
          git show "$RELEASE_HEAD_SHA:.release/stable.json" > "$metadata"
          stable_base="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["stable_base"])' "$metadata")"
          git checkout --detach "$base_sha"
          python3 tools/release.py verify-release-pr \
            --base-sha "$base_sha" \
            --head-sha "$RELEASE_HEAD_SHA" \
            --stable-sha "$stable_base"
          test "$(git rev-parse "$EXPECTED_MERGE_SHA^{tree}")" = \
            "$(git rev-parse "$RELEASE_HEAD_SHA^{tree}")"

  exact-sha-host-gates:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'release/stable' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/release-hosts.yml
    with:
      candidate_sha: ${{ github.event.pull_request.merge_commit_sha }}

  stage-publication:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'release/stable' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [verify-release-candidate, exact-sha-host-gates]
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      phase: ${{ steps.stage.outputs.phase }}
      version: ${{ steps.stage.outputs.version }}
      stable_base: ${{ steps.stage.outputs.stable_base }}
      main_source: ${{ steps.stage.outputs.main_source }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Configure release author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Stage exact stable and tag refs with trusted code
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE_SHA"
          merge_parents="$(git rev-list --parents -n 1 "$EXPECTED_MERGE_SHA")"
          set -- $merge_parents
          test "$#" -eq 3
          test "$1" = "$EXPECTED_MERGE_SHA"
          main_source="$2"
          test "$3" = "$RELEASE_HEAD_SHA"
          test "$(git rev-parse "$EXPECTED_MERGE_SHA^{tree}")" = \
            "$(git rev-parse "$RELEASE_HEAD_SHA^{tree}")"
          metadata="$RUNNER_TEMP/release-metadata.json"
          git show "$RELEASE_HEAD_SHA:.release/stable.json" > "$metadata"
          version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$metadata")"
          stable_base="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["stable_base"])' "$metadata")"
          metadata_main_source="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["main_source"])' "$metadata")"
          test "$metadata_main_source" = "$main_source"
          git show "$main_source:tools/release_publish.py" > "$RUNNER_TEMP/release_publish.py"
          if ! stage_json="$(
            python3 "$RUNNER_TEMP/release_publish.py" stage \
              --version "$version" \
              --candidate-sha "$EXPECTED_MERGE_SHA" \
              --prior-stable-sha "$stable_base"
          )"; then
            echo "$stage_json"
            exit 1
          fi
          echo "$stage_json"
          phase="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["phase"])' "$stage_json")"
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stable_base=$stable_base" >> "$GITHUB_OUTPUT"
          echo "main_source=$main_source" >> "$GITHUB_OUTPUT"

  public-stable-smoke:
    if: needs.stage-publication.outputs.phase == 'staged'
    needs: stage-publication
    permissions:
      contents: read
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install pinned host CLIs
        run: |
          set -euo pipefail
          claude_version="$(python3 -c 'import json; print(json.load(open("tools/data/host-cli-versions.json"))["claude_code"])')"
          codex_version="$(python3 -c 'import json; print(json.load(open("tools/data/host-cli-versions.json"))["codex"])')"
          npm install --global "@anthropic-ai/claude-code@${claude_version}" "@openai/codex@${codex_version}"
          claude --version | grep -F "${claude_version}"
          codex --version | grep -F "${codex_version}"
      - name: Exercise the real public stable channel
        env:
          EXPECTED_RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: make public-release-check EXPECTED_RELEASE_SHA="$EXPECTED_RELEASE_SHA"

  rollback-publication:
    if: >-
      always() &&
      needs.stage-publication.result == 'success' &&
      needs.stage-publication.outputs.phase == 'staged' &&
      needs.public-stable-smoke.result != 'success'
    needs: [stage-publication, public-stable-smoke]
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Roll back only the exact unpublished candidate refs
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          MAIN_SOURCE: ${{ needs.stage-publication.outputs.main_source }}
          STABLE_BASE: ${{ needs.stage-publication.outputs.stable_base }}
          VERSION: ${{ needs.stage-publication.outputs.version }}
        run: |
          set -euo pipefail
          git show "$MAIN_SOURCE:tools/release_publish.py" > "$RUNNER_TEMP/release_publish.py"
          python3 "$RUNNER_TEMP/release_publish.py" rollback \
            --version "$VERSION" \
            --candidate-sha "$EXPECTED_MERGE_SHA" \
            --prior-stable-sha "$STABLE_BASE"

  finalize-publication:
    if: >-
      always() &&
      needs.stage-publication.result == 'success' &&
      (
        needs.stage-publication.outputs.phase == 'published' ||
        needs.public-stable-smoke.result == 'success'
      )
    needs: [stage-publication, public-stable-smoke]
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Reconcile the immutable Release and clean the exact release branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAIN_SOURCE: ${{ needs.stage-publication.outputs.main_source }}
          STABLE_BASE: ${{ needs.stage-publication.outputs.stable_base }}
          VERSION: ${{ needs.stage-publication.outputs.version }}
        run: |
          set -euo pipefail
          git show "$MAIN_SOURCE:tools/release_publish.py" > "$RUNNER_TEMP/release_publish.py"
          metadata="$RUNNER_TEMP/release-metadata.json"
          git show "$RELEASE_HEAD_SHA:.release/stable.json" > "$metadata"
          python3 -c 'import json,pathlib,sys; data=json.load(open(sys.argv[1])); pathlib.Path(sys.argv[2]).write_text("".join(f"- {item}\n" for item in data["summaries"]), encoding="utf-8")' \
            "$metadata" "$RUNNER_TEMP/release-notes.md"
          python3 "$RUNNER_TEMP/release_publish.py" finalize \
            --version "$VERSION" \
            --candidate-sha "$EXPECTED_MERGE_SHA" \
            --prior-stable-sha "$STABLE_BASE" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --release-branch-sha "$RELEASE_HEAD_SHA"
