name: Auto release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dispatch:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Dispatch the Release when this push carries a release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: >-
          python3 tools/release.py auto-release
          --before "$BEFORE_SHA"
          --after "$AFTER_SHA"
