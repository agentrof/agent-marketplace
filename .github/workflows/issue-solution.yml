name: Issue solution automation

on:
  issues:
    types: [opened, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: issue-solution-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  preflight:
    if: vars.CODEX_ISSUE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.policy.outputs.eligible }}
      state: ${{ steps.policy.outputs.state }}
      reason: ${{ steps.policy.outputs.reason }}
      issue_number: ${{ steps.policy.outputs.issue_number }}
      branch: ${{ steps.policy.outputs.branch }}
      base_sha: ${{ steps.base.outputs.sha }}
      available: ${{ steps.existing.outputs.available }}
      existing_pr: ${{ steps.existing.outputs.existing_pr }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the default-branch source commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Evaluate the trusted issue trigger
        id: policy
        run: >-
          python3 tools/maintainer_automation.py evaluate-event
          --event "$GITHUB_EVENT_PATH"
          --github-output "$GITHUB_OUTPUT"
      - name: Refuse duplicate automation branches or pull requests
        id: existing
        if: steps.policy.outputs.eligible == 'true'
        env:
          BRANCH: ${{ steps.policy.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          existing_branch="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$BRANCH" --jq ". | map(select(.ref == \"refs/heads/$BRANCH\")) | length")"
          if [ -n "$existing_pr" ] || [ "$existing_branch" -ne 0 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "existing_pr=$existing_pr" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "existing_pr=" >> "$GITHUB_OUTPUT"
          fi

  awaiting-approval:
    needs: preflight
    if: needs.preflight.outputs.state == 'awaiting_approval'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Record the external-contributor approval boundary
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.preflight.outputs.issue_number }}
        run: |
          set -euo pipefail
          marker='<!-- maintainer-automation:awaiting-approval -->'
          comments="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --paginate --jq '.[].body')"
          if ! grep -Fq "$marker" <<< "$comments"; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$marker
          This issue is eligible for automated analysis, but external issue text is an untrusted input. A maintainer can start the isolated solution workflow by applying the \`automation:solve\` label after reviewing the report. Security reports must use private vulnerability reporting."
          fi

  duplicate-guard:
    needs: preflight
    if: >-
      needs.preflight.outputs.eligible == 'true' &&
      needs.preflight.outputs.available == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Report the existing automation branch
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.preflight.outputs.issue_number }}
          EXISTING_PR: ${{ needs.preflight.outputs.existing_pr }}
        run: |
          set -euo pipefail
          if [ -n "$EXISTING_PR" ]; then
            body="Automation did not start a duplicate run. Continue with pull request #$EXISTING_PR."
          else
            body="Automation did not start because its deterministic branch already exists without an open pull request. A maintainer must inspect or remove that stale branch."
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"

  solve:
    needs: preflight
    if: >-
      needs.preflight.outputs.eligible == 'true' &&
      needs.preflight.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      result: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.preflight.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - name: Render the bounded issue prompt
        run: |
          set -euo pipefail
          mkdir -p .codex-runtime
          printf '%s\n' '.codex-runtime/' >> .git/info/exclude
          python3 tools/maintainer_automation.py render-prompt \
            --event "$GITHUB_EVENT_PATH" \
            --template .github/codex/prompts/solve-issue.md \
            --output .codex-runtime/issue-prompt.md
      - name: Select the repository-tested Codex CLI
        id: codex-cli
        run: >-
          echo "version=$(python3 -c 'import json; print(json.load(open("tools/data/host-cli-versions.json"))["codex"])')"
          >> "$GITHUB_OUTPUT"
      - name: Analyze, challenge, implement, and test without GitHub write access
        id: codex
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .codex-runtime/issue-prompt.md
          output-schema-file: .github/codex/schemas/issue-solution.json
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          codex-version: ${{ steps.codex-cli.outputs.version }}

  verify:
    needs: [preflight, solve]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      status: ${{ steps.materialize.outputs.status }}
      summary: ${{ steps.materialize.outputs.summary }}
      patch_sha: ${{ steps.materialize.outputs.patch_sha }}
      verified: ${{ steps.verified.outputs.verified }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.preflight.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - name: Materialize the closed Codex result
        id: materialize
        env:
          CODEX_RESULT: ${{ needs.solve.outputs.result }}
          ISSUE_NUMBER: ${{ needs.preflight.outputs.issue_number }}
        run: >-
          python3 tools/maintainer_automation.py materialize-result
          --issue-number "$ISSUE_NUMBER"
          --patch "$RUNNER_TEMP/candidate.patch"
          --pr-title "$RUNNER_TEMP/pr-title.txt"
          --pr-body "$RUNNER_TEMP/pr-body.md"
          --github-output "$GITHUB_OUTPUT"
      - name: Apply the exact bounded patch in the secrets-free verifier
        if: steps.materialize.outputs.status == 'ready'
        run: |
          git apply --check "$RUNNER_TEMP/candidate.patch"
          git apply --index "$RUNNER_TEMP/candidate.patch"
      - name: Prove generated distributions are canonical
        if: steps.materialize.outputs.status == 'ready'
        run: |
          python3 tools/build_distributions.py
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Commit the candidate only inside the verifier
        if: steps.materialize.outputs.status == 'ready'
        run: |
          git config user.name "issue-solution-verifier"
          git config user.email "issue-solution-verifier@users.noreply.github.com"
          git commit -m "test: verify automated issue candidate"
      - name: Verify release declaration and the complete local gate
        if: steps.materialize.outputs.status == 'ready'
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
        run: |
          python3 tools/release.py check-pr --base "$BASE_SHA" --allow-bootstrap
          make check
      - name: Record verified evidence
        id: verified
        if: steps.materialize.outputs.status == 'ready'
        run: echo "verified=true" >> "$GITHUB_OUTPUT"

  publish-pr:
    needs: [preflight, solve, verify]
    if: >-
      needs.verify.outputs.status == 'ready' &&
      needs.verify.outputs.verified == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Revalidate issue authority and the destination before writes exist
        env:
          BRANCH: ${{ needs.preflight.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.preflight.outputs.issue_number }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" \
            --jq '{number, state, author_association, labels}' \
            > "$RUNNER_TEMP/live-issue.json"
          python3 tools/maintainer_automation.py validate-live-issue \
            --issue "$RUNNER_TEMP/live-issue.json" \
            --issue-number "$ISSUE_NUMBER"
          existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          existing_branch="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$BRANCH" --jq ". | map(select(.ref == \"refs/heads/$BRANCH\")) | length")"
          test -z "$existing_pr"
          test "$existing_branch" -eq 0
      - name: Mint a repository-scoped issue automation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.ISSUE_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.ISSUE_AUTOMATION_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.preflight.outputs.base_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - name: Re-materialize the verified result before granting repository writes
        env:
          CODEX_RESULT: ${{ needs.solve.outputs.result }}
          ISSUE_NUMBER: ${{ needs.preflight.outputs.issue_number }}
          EXPECTED_PATCH_SHA: ${{ needs.verify.outputs.patch_sha }}
        run: |
          python3 tools/maintainer_automation.py materialize-result \
            --issue-number "$ISSUE_NUMBER" \
            --patch "$RUNNER_TEMP/candidate.patch" \
            --pr-title "$RUNNER_TEMP/pr-title.txt" \
            --pr-body "$RUNNER_TEMP/pr-body.md"
          actual_patch_sha="$(sha256sum "$RUNNER_TEMP/candidate.patch" | awk '{print $1}')"
          test "$actual_patch_sha" = "$EXPECTED_PATCH_SHA"
          git apply --check "$RUNNER_TEMP/candidate.patch"
          git apply --index "$RUNNER_TEMP/candidate.patch"
      - name: Publish the review branch and pull request without executing candidate code
        env:
          BRANCH: ${{ needs.preflight.outputs.branch }}
          ISSUE_NUMBER: ${{ needs.preflight.outputs.issue_number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          title="$(tr -d '\n' < "$RUNNER_TEMP/pr-title.txt")"
          git commit -m "$title"
          candidate_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$BRANCH"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$DEFAULT_BRANCH" --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md")"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Automated analysis, challenge, implementation, and the secrets-free local gate completed at $candidate_sha. Review the pull request and wait for every required host and operating-system check: $pr_url"

  report-blocked:
    needs: [preflight, verify]
    if: needs.verify.outputs.status == 'blocked'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Return the bounded blocker to the issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.preflight.outputs.issue_number }}
          SUMMARY: ${{ needs.verify.outputs.summary }}
        run: >-
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
          --body "The isolated solution run stopped without publishing a branch: $SUMMARY"
