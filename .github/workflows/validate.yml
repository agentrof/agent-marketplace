name: validate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-validation
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - name: Require a release-impact declaration or an exact release commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/release.py check-pr --base "$BASE_SHA" --head "$HEAD_SHA"

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_tests: ${{ steps.plan.outputs.has_tests }}
      apple_launcher: ${{ steps.plan.outputs.apple_launcher }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Select coverage and verify prior validation evidence
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/ci_plan.py
          --output-directory "$RUNNER_TEMP/ci-plan"
          --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-plan/*.json
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  deterministic-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Validate contracts, release metadata, counts and generated distributions
        run: make static-check

  test-shards:
    name: tests (${{ matrix.lane }}, ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.has_tests == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exercise the Apple system Python launcher
        if: matrix.apple_launcher == true
        env:
          AGENT_MARKETPLACE_REQUIRE_APPLE_PYTHON3: "1"
          DEVELOPER_DIR: ""
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
          SDKROOT: ""
          TOOLCHAINS: ""
        run: >-
          /usr/bin/python3 -m unittest
          tools.tests.test_vault_hook.VaultHookShellContractTests.test_system_macos_python3_launcher_is_accepted
          tools.tests.test_vault_hook.VaultHookShellContractTests.test_issue_77_bare_python_cmd_preserves_attested_codex_result
          tools.tests.test_vault_hook.VaultHookShellContractTests.test_bare_python_candidate_with_invalid_result_is_restored
          tools.tests.test_vault_hook.VaultHookShellContractTests.test_bare_render_cannot_publish_a_different_valid_transition
          tools.tests.test_vault_hook.VaultHookShellContractTests.test_bare_render_with_forged_registry_is_restored
          tools.tests.test_vault_hook.VaultHookShellContractTests.test_issue_77_bare_init_has_an_exact_attested_delta
          tools.tests.test_vault_hook.VaultHookShellContractTests.test_issue_77_bare_init_preserves_real_codex_draft
      - name: Install the pinned Python package
        if: matrix.interpreter_version != ''
        shell: pwsh
        env:
          PACKAGE: ${{ matrix.interpreter_package }}
          VERSION: ${{ matrix.interpreter_version }}
          SHA512: ${{ matrix.interpreter_sha512 }}
        run: |
          $ProgressPreference = "SilentlyContinue"
          $archive = Join-Path $env:RUNNER_TEMP "interpreter.nupkg"
          $root = Join-Path $env:RUNNER_TEMP "interpreter"
          Invoke-WebRequest -MaximumRetryCount 3 -OutFile $archive `
            -Uri "https://api.nuget.org/v3-flatcontainer/$env:PACKAGE/$env:VERSION/$env:PACKAGE.$env:VERSION.nupkg"
          if ((Get-FileHash -Algorithm SHA512 -LiteralPath $archive).Hash.ToLowerInvariant() -ne $env:SHA512) {
            throw "the interpreter package digest differs from the policy"
          }
          Add-Type -AssemblyName System.IO.Compression.ZipFile
          [System.IO.Compression.ZipFile]::ExtractToDirectory($archive, $root)
          $tools = Join-Path $root "tools"
          New-Item -ItemType SymbolicLink -Path (Join-Path $tools "python3.exe") -Target (Join-Path $tools "python.exe") | Out-Null
          # Tests run with bytecode writes off; a module left uncompiled only starts slower.
          & (Join-Path $tools "python.exe") -m compileall -qq -j 0 -x site-packages (Join-Path $tools "Lib")
          $found = & (Join-Path $tools "python.exe") -c "import platform; print(platform.python_version())"
          if ($found -ne $env:VERSION) { throw "found Python $found instead of $env:VERSION" }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $tools
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.interpreter_version == ''
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-plan
      - name: Run the exact selected test partition
        env:
          CI_LANE: ${{ matrix.lane }}
          CI_SHARD: ${{ matrix.shard }}
          PYTHONDONTWRITEBYTECODE: "1"
          # Worker scratch on the runner's work disk; Windows TEMP is on the slower system disk.
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: >-
          python tools/ci_tests.py run
          --plan "$RUNNER_TEMP/ci-plan/ci-plan.json"
          --lane "$CI_LANE" --shard "$CI_SHARD"
          --report "$RUNNER_TEMP/test-report.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: ci-report-${{ github.run_id }}-${{ matrix.lane }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-report.json
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  compatibility:
    name: compatibility (${{ matrix.os }}, Python ${{ matrix.python }})
    if: always()
    needs: [plan, test-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: macos-latest
            python: "3.x"
    steps:
      - name: Require the selected platform test jobs
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          HAS_TESTS: ${{ needs.plan.outputs.has_tests }}
          TEST_RESULT: ${{ needs.test-shards.result }}
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = success
          if [ "$HAS_TESTS" = true ]; then
            test "$TEST_RESULT" = success
          else
            test "$HAS_TESTS" = false
            test "$TEST_RESULT" = skipped
          fi

  check:
    name: check
    if: always()
    needs:
      - changeset
      - plan
      - test-shards
      - deterministic-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every validation result
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGESET_RESULT: ${{ needs.changeset.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          HAS_TESTS: ${{ needs.plan.outputs.has_tests }}
          TEST_RESULT: ${{ needs.test-shards.result }}
          DETERMINISTIC_RESULT: ${{ needs.deterministic-check.result }}
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = success
          test "$DETERMINISTIC_RESULT" = success
          if [ "$HAS_TESTS" = true ]; then
            test "$TEST_RESULT" = success
          else
            test "$HAS_TESTS" = false
            test "$TEST_RESULT" = skipped
          fi
          expected_changeset=skipped
          if [ "$EVENT_NAME" = pull_request ]; then
            expected_changeset=success
          fi
          test "$CHANGESET_RESULT" = "$expected_changeset"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.plan.outputs.has_tests == 'true'
        with:
          pattern: ci-report-${{ github.run_id }}-*
          path: ${{ runner.temp }}/ci-reports
      - name: Verify complete test coverage
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-reports"
          python3 tools/ci_tests.py verify-reports \
            --plan "$RUNNER_TEMP/ci-plan/ci-plan.json" \
            --reports "$RUNNER_TEMP/ci-reports" \
            --output "$RUNNER_TEMP/ci-durations.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-durations-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-durations.json
          if-no-files-found: error
          retention-days: 7
      - name: Report scheduling, execution and fixture costs
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/ci_performance.py jobs
          --durations "$RUNNER_TEMP/ci-durations.json"
          --output "$RUNNER_TEMP/ci-performance.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: ci-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-performance.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Record reusable validation evidence
        if: >-
          github.event_name != 'schedule' && github.event_name != 'merge_group' &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.head.repo.full_name == github.repository))
        env:
          GH_TOKEN: ${{ github.token }}
          CI_MODE: ${{ needs.plan.outputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-reports"
          args=()
          if [ "$CI_MODE" = reuse ]; then
            args+=(--inherited "$RUNNER_TEMP/ci-plan/ci-reuse.json")
          fi
          python3 tools/ci_evidence.py create \
            --plan "$RUNNER_TEMP/ci-plan/ci-plan.json" \
            --reports "$RUNNER_TEMP/ci-reports" \
            --output "$RUNNER_TEMP/ci-evidence.json" "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: >-
          github.event_name != 'schedule' && github.event_name != 'merge_group' &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.head.repo.full_name == github.repository))
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence.json
          if-no-files-found: error
          retention-days: 7
