name: validate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-validation
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changeset:
    if: github.event_name == 'pull_request'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.plan.outputs.python }}
      - name: Require a release-impact declaration or an exact release commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/release.py check-pr --base "$BASE_SHA" --head "$HEAD_SHA"

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_tests: ${{ steps.plan.outputs.has_tests }}
      python: ${{ steps.plan.outputs.python }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # The CI policy's major.minor Python, which a test pins. This job plans the exact
      # release it resolved, and every later job sets up that release from its output.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Select coverage and verify prior validation evidence
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/ci_plan.py
          --output-directory "$RUNNER_TEMP/ci-plan"
          --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-plan/*.json
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  deterministic-check:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.plan.outputs.python }}
      - name: Validate contracts, release metadata, counts and generated distributions
        run: make static-check

  test-shards:
    name: tests (${{ matrix.lane }}, ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.has_tests == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-plan
      - name: Run the exact selected test partition
        env:
          CI_LANE: ${{ matrix.lane }}
          CI_SHARD: ${{ matrix.shard }}
          PYTHONDONTWRITEBYTECODE: "1"
          # Worker scratch on the runner's work disk; Windows TEMP is on the slower system disk.
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: >-
          python tools/ci_tests.py run
          --plan "$RUNNER_TEMP/ci-plan/ci-plan.json"
          --lane "$CI_LANE" --shard "$CI_SHARD"
          --report "$RUNNER_TEMP/test-report.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: ci-report-${{ github.run_id }}-${{ matrix.lane }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-report.json
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  check:
    name: check
    if: always()
    needs:
      - changeset
      - plan
      - test-shards
      - deterministic-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every validation result
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGESET_RESULT: ${{ needs.changeset.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          HAS_TESTS: ${{ needs.plan.outputs.has_tests }}
          TEST_RESULT: ${{ needs.test-shards.result }}
          DETERMINISTIC_RESULT: ${{ needs.deterministic-check.result }}
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = success
          test "$DETERMINISTIC_RESULT" = success
          if [ "$HAS_TESTS" = true ]; then
            test "$TEST_RESULT" = success
          else
            test "$HAS_TESTS" = false
            test "$TEST_RESULT" = skipped
          fi
          expected_changeset=skipped
          if [ "$EVENT_NAME" = pull_request ]; then
            expected_changeset=success
          fi
          test "$CHANGESET_RESULT" = "$expected_changeset"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.plan.outputs.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.plan.outputs.has_tests == 'true'
        with:
          pattern: ci-report-${{ github.run_id }}-*
          path: ${{ runner.temp }}/ci-reports
      - name: Verify complete test coverage
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-reports"
          python3 tools/ci_tests.py verify-reports \
            --plan "$RUNNER_TEMP/ci-plan/ci-plan.json" \
            --reports "$RUNNER_TEMP/ci-reports" \
            --output "$RUNNER_TEMP/ci-durations.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-durations-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-durations.json
          if-no-files-found: error
          retention-days: 7
      - name: Report scheduling, execution and fixture costs
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/ci_performance.py jobs
          --durations "$RUNNER_TEMP/ci-durations.json"
          --output "$RUNNER_TEMP/ci-performance.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: ci-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-performance.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Record reusable validation evidence
        if: >-
          github.event_name != 'schedule' && github.event_name != 'merge_group' &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.head.repo.full_name == github.repository))
        env:
          GH_TOKEN: ${{ github.token }}
          CI_MODE: ${{ needs.plan.outputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-reports"
          args=()
          if [ "$CI_MODE" = reuse ]; then
            args+=(--inherited "$RUNNER_TEMP/ci-plan/ci-reuse.json")
          fi
          python3 tools/ci_evidence.py create \
            --plan "$RUNNER_TEMP/ci-plan/ci-plan.json" \
            --reports "$RUNNER_TEMP/ci-reports" \
            --output "$RUNNER_TEMP/ci-evidence.json" "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: >-
          github.event_name != 'schedule' && github.event_name != 'merge_group' &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.head.repo.full_name == github.repository))
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence.json
          if-no-files-found: error
          retention-days: 7
