*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{overflow-x:hidden}
:root[data-theme="light"] .obs-root{
  --obs-bg:#ffffff;--obs-bg-subtle:#fafafa;--obs-surface:#fcfcfd;--obs-surface-raised:#ffffff;
  --obs-border:#e6e6e9;--obs-border-strong:#d1d1d6;
  --obs-fg:#131316;--obs-fg-muted:#55565f;--obs-fg-subtle:#6f7079;
  --obs-accent-text:#1237e8;--obs-accent-solid:#1237e8;--obs-accent-on:#ffffff;
  --obs-accent-surface:#eceffd;--obs-accent-border:#c2cdfa;
  --obs-good:#067647;--obs-warning:#8a5a00;--obs-danger:#b42318;
  --obs-shadow-sm:0 1px 2px rgba(19,19,22,.05),0 1px 1px rgba(19,19,22,.04);
  --obs-shadow-md:0 4px 10px rgba(19,19,22,.06),0 8px 24px rgba(19,19,22,.06);
  --obs-shadow-lg:0 8px 24px rgba(19,19,22,.08),0 20px 48px rgba(19,19,22,.10);
}
:root[data-theme="dark"] .obs-root{
  --obs-bg:#0c0d10;--obs-bg-subtle:#101114;--obs-surface:#16171b;--obs-surface-raised:#1c1e23;
  --obs-border:#2a2c32;--obs-border-strong:#3c3f47;
  --obs-fg:#f7f7f8;--obs-fg-muted:#a3a4ad;--obs-fg-subtle:#84858e;
  --obs-accent-text:#1cb8ff;--obs-accent-solid:#3de3ff;--obs-accent-on:#04050a;
  --obs-accent-surface:#020f14;--obs-accent-border:#0f3a44;
  --obs-good:#34d399;--obs-warning:#fbbf24;--obs-danger:#f87171;
  --obs-shadow-sm:0 1px 2px rgba(0,0,0,.4),0 0 0 1px var(--obs-border);
  --obs-shadow-md:0 8px 20px rgba(0,0,0,.45),0 0 0 1px var(--obs-border);
  --obs-shadow-lg:0 20px 48px rgba(0,0,0,.55),0 0 0 1px var(--obs-border-strong);
}
.obs-root{
  --obs-bg:#0c0d10;--obs-bg-subtle:#101114;--obs-surface:#16171b;--obs-surface-raised:#1c1e23;
  --obs-border:#2a2c32;--obs-border-strong:#3c3f47;
  --obs-fg:#f7f7f8;--obs-fg-muted:#a3a4ad;--obs-fg-subtle:#84858e;
  --obs-accent-text:#1cb8ff;--obs-accent-solid:#3de3ff;--obs-accent-on:#04050a;
  --obs-accent-surface:#020f14;--obs-accent-border:#0f3a44;
  --obs-good:#34d399;--obs-warning:#fbbf24;--obs-danger:#f87171;
  --obs-shadow-sm:0 1px 2px rgba(0,0,0,.4),0 0 0 1px var(--obs-border);
  --obs-shadow-md:0 8px 20px rgba(0,0,0,.45),0 0 0 1px var(--obs-border);
  --obs-shadow-lg:0 20px 48px rgba(0,0,0,.55),0 0 0 1px var(--obs-border-strong);
  --obs-ramp-full:linear-gradient(135deg,#3DE3FF,#1CB8FF 30%,#1578FF 55%,#2453FF 78%,#1237E8);
  --obs-chrome-tile:linear-gradient(135deg,#1578FF,#1237E8);
  --obs-radius-sm:10px;--obs-radius-md:14px;--obs-radius-lg:20px;--obs-radius-xl:28px;
  --obs-space-1:8px;--obs-space-2:12px;--obs-space-3:16px;--obs-space-4:24px;--obs-space-5:32px;--obs-space-6:48px;--obs-space-7:72px;
  --obs-dur-fast:150ms;--obs-dur-base:220ms;--obs-dur-slow:300ms;--obs-ease:cubic-bezier(.3,.7,.4,1);
  font-family:'Inter',system-ui,sans-serif;background:var(--obs-bg);color:var(--obs-fg);font-size:15px;line-height:1.6;min-height:100vh;
}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important } }
.obs-root *:focus-visible{outline:2px solid var(--obs-accent-solid);outline-offset:2px}
.icon{width:16px;height:16px;flex-shrink:0;fill:currentColor}
.icon-20{width:20px;height:20px}
.icon-24{width:24px;height:24px}
@keyframes obs-spin{to{transform:rotate(360deg)}}
.obs-status.running .icon{animation:obs-spin 1.6s linear infinite;transform-origin:center}
.obs-step-icon.obs-spin svg{animation:obs-spin 1.6s linear infinite;transform-origin:center}

.obs-top{padding:var(--obs-space-3) var(--obs-space-4) 0;background:var(--obs-surface);border-bottom:1px solid var(--obs-border);position:sticky;top:0;z-index:10}
.obs-brand-row{display:flex;align-items:center;gap:12px;padding-bottom:var(--obs-space-3)}
.obs-tile{width:36px;height:36px;border-radius:var(--obs-radius-sm);background:var(--obs-chrome-tile);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.obs-tile svg{width:20px;height:20px;display:block}
.obs-brand-row .name{font-size:16px;font-weight:700;letter-spacing:-.2px}
.obs-brand-row .sub{font-size:12px;color:var(--obs-fg-subtle);margin-top:1px}
.obs-brand-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.obs-icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--obs-border);border-radius:var(--obs-radius-sm);color:var(--obs-fg-muted);background:transparent}
.obs-icon-btn:hover{border-color:var(--obs-border-strong);color:var(--obs-fg)}
.obs-tabs{display:flex;gap:var(--obs-space-4);overflow-x:auto}
.obs-tabs a{display:flex;align-items:center;gap:8px;padding:12px 2px;min-height:44px;font-size:13.5px;font-weight:500;color:var(--obs-fg-subtle);border-bottom:2px solid transparent;white-space:nowrap;text-decoration:none}
.obs-tabs a:hover{color:var(--obs-fg)}
.obs-tabs a.active{color:var(--obs-fg);font-weight:600;border-bottom-color:var(--obs-accent-solid)}

.obs-sysline{max-width:1400px;margin:0 auto;width:100%;padding:var(--obs-space-2) var(--obs-space-4) var(--obs-space-4);color:var(--obs-fg-subtle);font-size:11.5px}
.obs-sysline .tnum{font-variant-numeric:tabular-nums}
#banner-area{padding:0}
#banner-area:empty{display:none}
.obs-banner{display:flex;align-items:center;gap:10px;padding:14px 20px;border-radius:var(--obs-radius-md);font-size:13.5px;margin:var(--obs-space-3) var(--obs-space-4) 0}
.obs-banner.warn{background:color-mix(in srgb,var(--obs-warning) 14%,var(--obs-surface));color:var(--obs-warning);border:1px solid var(--obs-warning)}

.obs-main{padding:var(--obs-space-5) var(--obs-space-4);display:flex;flex-direction:column;gap:var(--obs-space-4);max-width:1400px;margin:0 auto;width:100%}
.obs-hero{display:grid;grid-template-columns:1.1fr 1fr;gap:var(--obs-space-5);align-items:center;padding:var(--obs-space-5);border-radius:var(--obs-radius-lg);background:var(--obs-surface);box-shadow:var(--obs-shadow-sm);position:relative;overflow:hidden}
.obs-hero::before{content:"";position:absolute;inset:auto -20% -60% auto;width:60%;aspect-ratio:1;border-radius:999px;background:var(--obs-ramp-full);opacity:.14;filter:blur(2px)}
.obs-hero-num{font-size:56px;font-weight:700;letter-spacing:-1px;line-height:1.05;position:relative}
.obs-hero-label{font-size:13px;color:var(--obs-fg-subtle);text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:8px;position:relative}
.obs-hero-sub{font-size:14px;color:var(--obs-fg-muted);margin-top:8px;position:relative}
.obs-mini-kpis{display:grid;grid-template-columns:1fr 1fr;gap:var(--obs-space-3);position:relative}
.obs-mini-kpi{padding:var(--obs-space-3);border-radius:var(--obs-radius-md);background:var(--obs-surface-raised);box-shadow:var(--obs-shadow-sm)}
.obs-mini-kpi .lbl{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--obs-fg-subtle);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:6px}
.obs-mini-kpi .val{font-size:22px;font-weight:700}

.obs-panel{border-radius:var(--obs-radius-lg);background:var(--obs-surface);box-shadow:var(--obs-shadow-sm);overflow:hidden}
.obs-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:var(--obs-space-4) var(--obs-space-5);border-bottom:1px solid var(--obs-border);flex-wrap:wrap}
.obs-panel-head h1,.obs-panel-head h3{font-size:16px;font-weight:600;margin:0}
.obs-panel-head .obs-count{font-size:12.5px;color:var(--obs-fg-subtle)}
.obs-panel-head .obs-count a{color:var(--obs-accent-text)}

.obs-wo-row{padding:var(--obs-space-4) var(--obs-space-5);border-bottom:1px solid var(--obs-border);display:flex;flex-direction:column;gap:14px;min-height:44px;text-decoration:none;color:inherit}
.obs-wo-row:last-child{border-bottom:0}
.obs-wo-row:hover{background:var(--obs-bg-subtle)}
.obs-wo-top{display:flex;align-items:center;gap:12px;min-width:0;flex-wrap:wrap}
.obs-wo-id{font-size:12px;color:var(--obs-fg-subtle);flex-shrink:0}
.obs-wo-title{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.obs-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;flex-shrink:0}
.obs-status.running{color:var(--obs-accent-text);background:var(--obs-accent-surface)}
.obs-status.waiting_gate{color:var(--obs-warning);background:color-mix(in srgb,var(--obs-warning) 14%,var(--obs-surface))}
.obs-status.blocked,.obs-status.escalated{color:var(--obs-danger);background:color-mix(in srgb,var(--obs-danger) 14%,var(--obs-surface))}
.obs-status.complete{color:var(--obs-good);background:color-mix(in srgb,var(--obs-good) 14%,var(--obs-surface))}
.obs-status .icon{width:13px;height:13px}
.obs-dangling{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--obs-danger);border:1px solid var(--obs-danger);border-radius:999px;padding:3px 10px;flex-shrink:0}
.obs-dangling .icon{width:12px;height:12px}
.obs-ladder{display:flex;align-items:center;gap:0;flex-wrap:wrap}
.obs-ladder-step{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0}
.obs-ladder-dot{width:26px;height:26px;border-radius:999px;border:2px solid var(--obs-border-strong);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--obs-fg-subtle);background:var(--obs-bg)}
.obs-ladder-dot.done{background:var(--obs-accent-solid);border-color:var(--obs-accent-solid);color:var(--obs-accent-on)}
.obs-ladder-dot.now{border-color:var(--obs-accent-solid);color:var(--obs-accent-text);box-shadow:0 0 0 3px var(--obs-accent-surface)}
.obs-ladder-dot.now.gate{border-color:var(--obs-warning);color:var(--obs-warning);box-shadow:0 0 0 3px color-mix(in srgb,var(--obs-warning) 14%,var(--obs-surface))}
.obs-ladder-step span.lbl{font-size:10.5px;color:var(--obs-fg-subtle);font-weight:600}
.obs-ladder-step.now span.lbl{color:var(--obs-accent-text)}
.obs-ladder-line{width:36px;height:2px;background:var(--obs-border-strong);margin:0 6px 20px}
.obs-ladder-line.done{background:var(--obs-accent-solid)}
.obs-wo-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--obs-fg-subtle)}
.obs-wo-meta b{color:var(--obs-fg-muted);font-weight:600}

.obs-split{display:grid;grid-template-columns:1.3fr 1fr;gap:var(--obs-space-4);align-items:start}
.obs-board-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--obs-space-3);padding:var(--obs-space-3) var(--obs-space-5) var(--obs-space-5)}
.obs-board-col h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--obs-fg-subtle);margin-bottom:10px;font-weight:600}
.obs-card{border-radius:var(--obs-radius-md);padding:16px;background:var(--obs-surface-raised);box-shadow:var(--obs-shadow-sm);margin-bottom:12px;transition:transform var(--obs-dur-base) var(--obs-ease)}
.obs-card:hover{box-shadow:var(--obs-shadow-md);transform:translateY(-2px)}
.obs-card-title{font-size:13.5px;font-weight:500;margin-bottom:8px}
.obs-chip{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.3px}
.obs-chip.critical{color:var(--obs-danger);background:color-mix(in srgb,var(--obs-danger) 14%,var(--obs-surface-raised))}
.obs-chip.high{color:var(--obs-warning);background:color-mix(in srgb,var(--obs-warning) 14%,var(--obs-surface-raised))}
.obs-chip.medium{color:var(--obs-accent-text);background:var(--obs-accent-surface)}
.obs-chip.low{color:var(--obs-fg-subtle);background:var(--obs-bg-subtle)}
.obs-reason{font-size:11.5px;color:var(--obs-fg-subtle);margin-top:8px;line-height:1.5}
.obs-dep{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--obs-fg-subtle);margin-top:8px;text-decoration:none}
.obs-dep .icon{width:13px;height:13px;color:var(--obs-accent-text)}
.obs-dod{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.obs-dod-item{display:flex;align-items:center;gap:7px;font-size:12px}
.obs-dod-item .icon{width:14px;height:14px}
.obs-dod-item.verified .icon{color:var(--obs-good)}
.obs-dod-item.failed .icon{color:var(--obs-danger)}
.obs-dod-item.pending .icon{color:var(--obs-fg-subtle)}
.obs-dod-item.failed span{color:var(--obs-danger)}
.obs-subtasks{margin-top:10px;padding-top:10px;border-top:1px dashed var(--obs-border);display:flex;flex-direction:column;gap:8px}
.obs-subtask-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px}
.obs-subtask-title{font-weight:500}
.obs-subtask-status{color:var(--obs-fg-subtle);font-size:11px}

.obs-list-row{display:flex;align-items:center;gap:12px;padding:14px var(--obs-space-5);border-bottom:1px solid var(--obs-border);font-size:13.5px}
.obs-list-row:last-child{border-bottom:0}
.obs-list-row .icon{color:var(--obs-fg-subtle);flex-shrink:0}
.obs-list-row time{margin-left:auto;font-size:12px;color:var(--obs-fg-subtle);flex-shrink:0}
.obs-cost{font-weight:600;color:var(--obs-fg)}
.obs-finding{display:flex;align-items:center;gap:10px;padding:14px var(--obs-space-5);border-bottom:1px solid var(--obs-border);font-size:13.5px}
.obs-finding:last-child{border-bottom:0}
.obs-sev{font-size:10.5px;font-weight:700;text-transform:uppercase;padding:3px 9px;border-radius:999px;flex-shrink:0}
.obs-sev.critical{color:var(--obs-danger);background:color-mix(in srgb,var(--obs-danger) 14%,var(--obs-surface))}
.obs-sev.high{color:var(--obs-warning);background:color-mix(in srgb,var(--obs-warning) 14%,var(--obs-surface))}
.obs-sev.medium{color:var(--obs-accent-text);background:var(--obs-accent-surface)}
.obs-sev.low{color:var(--obs-fg-subtle);background:var(--obs-bg-subtle)}
.obs-sev.good{color:var(--obs-good);background:color-mix(in srgb,var(--obs-good) 14%,var(--obs-surface))}
.obs-finding-src{font-size:12px;color:var(--obs-fg-subtle);margin-left:auto}
.obs-finding-extra{font-size:11.5px;color:var(--obs-fg-subtle);margin-top:4px}

.obs-tag{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;margin:2px 4px 2px 0}
.obs-tag.good{color:var(--obs-good);background:color-mix(in srgb,var(--obs-good) 14%,var(--obs-surface))}
.obs-tag.warning{color:var(--obs-warning);background:color-mix(in srgb,var(--obs-warning) 14%,var(--obs-surface))}
.obs-tag.danger{color:var(--obs-danger);background:color-mix(in srgb,var(--obs-danger) 14%,var(--obs-surface))}
.obs-tag.accent{color:var(--obs-accent-text);background:var(--obs-accent-surface)}
.obs-tag.neutral{color:var(--obs-fg-subtle);background:var(--obs-bg-subtle)}

.obs-table-wrap{border-radius:var(--obs-radius-lg);box-shadow:var(--obs-shadow-sm);overflow-x:auto;background:var(--obs-surface)}
.obs-table{width:100%;border-collapse:collapse;font-size:13.5px}
.obs-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--obs-fg-subtle);font-weight:600;padding:14px 20px;border-bottom:1px solid var(--obs-border);white-space:nowrap}
.obs-table td{padding:12px 20px;border-bottom:1px solid var(--obs-border);vertical-align:top}
.obs-table tr:last-child td{border-bottom:0}
.tnum,.obs-table td.tnum{font-variant-numeric:tabular-nums}
.obs-fg-subtle{color:var(--obs-fg-subtle)}
.obs-fg-muted{color:var(--obs-fg-muted)}

.obs-empty{padding:var(--obs-space-6) var(--obs-space-5);text-align:center;color:var(--obs-fg-subtle)}
.obs-empty .icon.danger{color:var(--obs-danger)}
.obs-empty .icon{margin:0 auto 14px;color:var(--obs-fg-subtle)}
.obs-empty p{font-size:14px;margin-bottom:16px;max-width:48ch;margin-left:auto;margin-right:auto}
.obs-inline-note{padding:var(--obs-space-3) var(--obs-space-5);color:var(--obs-fg-subtle);font-size:13px;margin:0}
.obs-btn{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;padding:11px 22px;min-height:44px;border-radius:var(--obs-radius-md);background:var(--obs-accent-solid);color:var(--obs-accent-on);transition:transform var(--obs-dur-fast) var(--obs-ease);border:0;cursor:pointer}
.obs-btn:hover{box-shadow:var(--obs-shadow-md);transform:translateY(-1px)}

.obs-crumb{font-size:12.5px;color:var(--obs-fg-subtle)}
.obs-crumb a{color:var(--obs-accent-text)}
.obs-page-head h1{font-size:32px;line-height:1.1;letter-spacing:-.6px;font-weight:700;margin:4px 0 6px}
.obs-page-sub{font-size:13.5px;color:var(--obs-fg-subtle);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.obs-page-sub a{color:var(--obs-accent-text)}
.obs-request{font-size:14px;color:var(--obs-fg-muted);margin-top:8px}

.obs-step-row{display:flex;align-items:center;gap:12px;padding:14px var(--obs-space-5);border-bottom:1px solid var(--obs-border);font-size:13.5px;flex-wrap:wrap}
.obs-step-row:last-child{border-bottom:0}
.obs-step-icon{display:flex;color:var(--obs-fg-subtle)}
.obs-step-row.done .obs-step-icon{color:var(--obs-good)}
.obs-step-row.now .obs-step-icon{color:var(--obs-accent-text)}
.obs-step-label{font-weight:500;min-width:90px}

.obs-kv-list{padding:var(--obs-space-2) var(--obs-space-5) var(--obs-space-4);display:flex;flex-direction:column;gap:8px}
.obs-kv-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--obs-border)}
.obs-kv-row:last-child{border-bottom:0}

.obs-task-block{padding:14px var(--obs-space-5);border-bottom:1px solid var(--obs-border)}
.obs-task-block:last-child{border-bottom:0}
.obs-task-head{font-size:13.5px;margin-bottom:8px}

.obs-order-body{padding:var(--obs-space-3) var(--obs-space-5) var(--obs-space-5)}
.obs-order-list{display:flex;flex-wrap:wrap;gap:8px;list-style:none;counter-reset:ord;padding:0;margin:0}
.obs-order-list li{counter-increment:ord;background:var(--obs-surface-raised);box-shadow:var(--obs-shadow-sm);border-radius:var(--obs-radius-sm);padding:6px 12px;font-size:12.5px}
.obs-order-list li::before{content:counter(ord)". ";color:var(--obs-fg-subtle);font-weight:600}
.obs-order-sub{margin:var(--obs-space-3) 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--obs-fg-subtle);font-weight:600}

.obs-catalog-body{padding:var(--obs-space-3) var(--obs-space-5) var(--obs-space-5);display:flex;flex-direction:column;gap:10px}
.obs-sub-label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--obs-fg-subtle);font-weight:600;margin-top:8px}
.obs-roster{display:flex;flex-wrap:wrap;gap:6px}
.obs-roster-chip{font-size:11.5px;padding:4px 10px;border-radius:999px;background:var(--obs-bg-subtle);color:var(--obs-fg-muted)}
.obs-install-list{display:flex;flex-direction:column;gap:6px}
.obs-install-row{display:flex;gap:14px;font-size:12px;flex-wrap:wrap;color:var(--obs-fg-muted)}
.obs-tag-row{display:flex;flex-wrap:wrap}

.obs-project-body{padding:var(--obs-space-3) var(--obs-space-5) var(--obs-space-4);display:flex;flex-direction:column;gap:12px}
.obs-count-groups{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--obs-fg-muted)}
.obs-count-group b{color:var(--obs-fg)}

.obs-events-toolbar{padding:0 var(--obs-space-5) var(--obs-space-2)}
.obs-events-filter{display:flex;align-items:center;gap:8px;border:1px solid var(--obs-border);border-radius:var(--obs-radius-md);padding:8px 14px;color:var(--obs-fg-subtle);font-size:13px;max-width:360px}
.obs-events-filter input{border:0;background:transparent;color:var(--obs-fg);font:inherit;flex:1;outline:none}
.obs-load-more{padding:var(--obs-space-4) var(--obs-space-5);text-align:center}

.obs-skel-body{padding:var(--obs-space-4) var(--obs-space-5)}
.obs-skel-block{height:14px;border-radius:6px;background:var(--obs-border);margin-bottom:12px}

.obs-link-row{text-decoration:none;color:inherit}

@media (max-width:1024px){.obs-hero{grid-template-columns:1fr}.obs-split{grid-template-columns:1fr}}
@media (max-width:768px){.obs-board-cols{grid-template-columns:1fr}.obs-mini-kpis{grid-template-columns:1fr 1fr}}
</style>
</head>

<script>
(function(){
"use strict";

/* ---------- generic helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function icon(name, cls){ return '<svg class="icon '+(cls||'')+'" aria-hidden="true"><use href="#i-'+name+'"></use></svg>'; }
function titleCase(s){ s = String(s||''); return s.replace(/_/g,' ').replace(/^./, function(c){ return c.toUpperCase(); }); }
function money(v){ return v==null ? null : ('$'+Number(v).toFixed(2)); }
function parseTs(ts){
  if(!ts) return null;
  var s = String(ts).trim();
  if(!/Z$|[+-]\d\d:\d\d$/.test(s)) s = s.replace(' ','T')+'Z';
  var d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}
function fmtTs(ts){ var d = parseTs(ts); return d ? d.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}) : (ts || '-'); }
function fmtDate(ts){ var d = parseTs(ts); return d ? d.toLocaleDateString() : (ts || '-'); }
function relTime(ts){
  var d = parseTs(ts);
  if(!d) return '-';
  var diff = Date.now() - d.getTime();
  if(diff < 60000) return 'just now';
  var m = Math.floor(diff/60000);
  if(m < 60) return m+'m ago';
  var h = Math.floor(m/60);
  if(h < 24) return h+'h ago';
  var dd = Math.floor(h/24);
  return dd+'d ago';
}
function emptyInline(text){ return '<p class="obs-inline-note">'+esc(text)+'</p>'; }
function emptyPanel(iconName, sentence, ctaLabel, action){
  return '<div class="obs-panel"><div class="obs-empty">'+icon(iconName,'icon-24')+'<p>'+esc(sentence)+'</p><button class="obs-btn" type="button" data-action="'+action+'">'+icon('arrow-sync')+esc(ctaLabel)+'</button></div></div>';
}
function tableWrap(headers, bodyHtml){
  return '<div class="obs-table-wrap"><table class="obs-table"><thead><tr>'+headers.map(function(h){ return '<th>'+esc(h)+'</th>'; }).join('')+'</tr></thead><tbody>'+bodyHtml+'</tbody></table></div>';
}
function verdictTag(v, goodValues){
  var cls = goodValues.indexOf(v) !== -1 ? 'good' : (v === 'fail' ? 'danger' : 'warning');
  return '<span class="obs-tag '+cls+'">'+esc(titleCase(v))+'</span>';
}

/* ---------- status vocabulary (requirement D) ---------- */
var WO_STATUS_LABEL = {running:'In progress', waiting_gate:'Waiting approval', blocked:'Blocked', escalated:'Escalated', complete:'Complete'};
var WO_STATUS_ICON = {running:'arrow-sync', waiting_gate:'shield-task', blocked:'warning', escalated:'alert', complete:'checkmark-circle-filled'};
function statusPill(status){
  var label = WO_STATUS_LABEL[status] || titleCase(status);
  var ic = WO_STATUS_ICON[status] || 'document-bullet-list';
  return '<span class="obs-status '+esc(status)+'">'+icon(ic)+esc(label)+'</span>';
}

var CANONICAL_STEPS = ['Plan','Build','Review','QA','Gate','Done'];
function stepLabel(stepId, idx, total){
  return (total === 6 && idx < 6) ? CANONICAL_STEPS[idx] : ('Step '+stepId);
}
function ladder(steps, currentStep, woStatus){
  if(!steps || !steps.length) return '<p class="obs-inline-note">No steps recorded yet.</p>';
  var out = '<div class="obs-ladder">';
  steps.forEach(function(s, i){
    var label = stepLabel(s.step_id, i, steps.length);
    var isNow = String(s.step_id) === String(currentStep);
    var cls = s.status === 'done' ? 'done' : (isNow ? (woStatus === 'waiting_gate' ? 'now gate' : 'now') : '');
    out += '<div class="obs-ladder-step '+cls+'"><span class="obs-ladder-dot '+cls+'">'+esc(String(i))+'</span><span class="lbl">'+esc(label)+'</span></div>';
    if(i < steps.length - 1) out += '<span class="obs-ladder-line '+(s.status === 'done' ? 'done' : '')+'"></span>';
  });
  out += '</div>';
  return out;
}
function woRow(w, showProject){
  var link = '#/wo/'+encodeURIComponent(w.work_order_key);
  var title = w.story ? esc(w.story.title) : 'No linked story';
  var dangleHtml = w.dangling ? '<span class="obs-dangling">'+icon('alert')+'Dangling</span>' : '';
  var meta = [];
  meta.push('<span>Review round <b class="tnum">'+w.review_rounds+'</b></span>');
  meta.push('<span>QA round <b class="tnum">'+w.qa_rounds+'</b></span>');
  if(w.status === 'waiting_gate') meta.push('<span>Human gate <b>pending</b></span>');
  if(w.dangling) meta.push('<span>No attempt since <b>'+esc(relTime(w.updated_at))+'</b> - flagged for owner attention</span>');
  var projLabel = (showProject && w.project_key) ? '<span class="obs-fg-subtle tnum">'+esc(w.project_key)+'</span>' : '';
  return '<a class="obs-wo-row" href="'+link+'">'
    + '<div class="obs-wo-top">'+projLabel
    + '<span class="obs-wo-id tnum">'+esc(w.work_order_key)+'</span>'
    + '<span class="obs-wo-title" title="'+esc(title)+'">'+title+'</span>'
    + statusPill(w.status) + dangleHtml
    + '</div>'
    + ladder(w.steps, w.current_step, w.status)
    + '<div class="obs-wo-meta">'+meta.join('')+'</div>'
    + '</a>';
}

/* ---------- board / project helpers ---------- */
function priorityChip(priorityRaw){
  if(!priorityRaw) return '';
  var idx = priorityRaw.indexOf(':');
  var tier = (idx === -1 ? priorityRaw : priorityRaw.slice(0, idx)).trim().toLowerCase();
  var reason = idx === -1 ? '' : priorityRaw.slice(idx+1).trim();
  var cls = ['critical','high','medium','low'].indexOf(tier) !== -1 ? tier : 'low';
  var html = '<span class="obs-chip '+cls+'">'+esc(titleCase(tier))+'</span>';
  if(reason) html += '<p class="obs-reason">'+esc(reason)+'</p>';
  return html;
}
function depLines(externalId, deps){
  var mine = deps.filter(function(d){ return d.item === externalId; });
  if(!mine.length) return '';
  return mine.map(function(d){
    return '<div class="obs-dep">'+icon('link')+'Depends on '+esc(d.depends_on)+(d.reason ? ' - '+esc(d.reason) : '')+'</div>';
  }).join('');
}
function dodChecklist(items){
  if(!items || !items.length) return '';
  return '<div class="obs-dod">' + items.map(function(d){
    var st = d.status;
    var ic = st === 'verified' ? 'checkmark-circle-filled' : (st === 'failed' ? 'dismiss-circle' : 'checkmark-circle');
    var extra = (st === 'failed' && d.failure_reason) ? ' - '+esc(d.failure_reason) : '';
    return '<div class="obs-dod-item '+st+'">'+icon(ic)+'<span>'+esc(d.statement)+extra+'</span></div>';
  }).join('') + '</div>';
}
function taskRow(t, deps){
  var html = '<div class="obs-subtask-row"><span class="obs-subtask-title">'+esc(t.external_id)+' '+esc(t.title)+'</span><span class="obs-subtask-status">'+esc(titleCase(t.status))+'</span></div>';
  html += priorityChip(t.priority);
  html += depLines(t.external_id, deps);
  html += dodChecklist(t.dod_items);
  if(t.work_order_key) html += '<a class="obs-dep" href="#/wo/'+encodeURIComponent(t.work_order_key)+'">'+icon('link')+'Work order '+esc(t.work_order_key)+'</a>';
  return html;
}
function itemCard(item, deps){
  var html = '<div class="obs-card">';
  html += '<div class="obs-card-title">'+esc(item.external_id)+' - '+esc(item.title)+'</div>';
  html += priorityChip(item.priority);
  html += depLines(item.external_id, deps);
  html += dodChecklist(item.dod_items);
  if(item.work_order_key) html += '<a class="obs-dep" href="#/wo/'+encodeURIComponent(item.work_order_key)+'">'+icon('link')+'Work order '+esc(item.work_order_key)+'</a>';
  if(item.tasks && item.tasks.length){
    html += '<div class="obs-subtasks">' + item.tasks.map(function(t){ return taskRow(t, deps); }).join('') + '</div>';
  }
  html += '</div>';
  return html;
}
function groupByStatus(items){
  var groups = {};
  items.forEach(function(it){ (groups[it.status] = groups[it.status] || []).push(it); });
  return groups;
}
function boardColumns(items, deps){
  var groups = groupByStatus(items);
  var keys = Object.keys(groups);
  if(!keys.length) return emptyInline('No items yet.');
  return '<div class="obs-board-cols">' + keys.map(function(st){

/* ---------- data layer ---------- */
var inflight = new Map();
function getJSON(url){
  if(inflight.has(url)) return inflight.get(url);
  var p = fetch(url, {cache:'no-store'}).then(function(res){
    return res.json().catch(function(){ return null; }).then(function(body){
      if(!res.ok){
        var err = new Error((body && body.message) || ('HTTP '+res.status));
        err.status = res.status; err.code = body && body.error; err.body = body;
        throw err;
      }
      return body;
    });
  }).finally(function(){ inflight.delete(url); });
  inflight.set(url, p);
  return p;
}
var API = {
  head: function(){ return getJSON('/api/head'); },
  overview: function(){ return getJSON('/api/overview'); },
  catalog: function(){ return getJSON('/api/catalog'); },
  project: function(key){ return getJSON('/api/project?key='+encodeURIComponent(key)); },
  workOrders: function(projectKey){ return getJSON('/api/work_orders'+(projectKey ? ('?project_key='+encodeURIComponent(projectKey)) : '')); },
  workOrder: function(key){ return getJSON('/api/work_order?key='+encodeURIComponent(key)); },
  ledger: function(projectKey){ return getJSON('/api/ledger?project_key='+encodeURIComponent(projectKey)); },
  events: function(sinceId, projectKey, limit){ return getJSON('/api/events?since_id='+encodeURIComponent(sinceId)+'&limit='+encodeURIComponent(limit||100)+(projectKey ? ('&project_key='+encodeURIComponent(projectKey)) : '')); }
};

function renderBanners(){
  var html = '';

    html += '<div class="obs-banner warn">'+icon('warning')+'<span>The database schema (v'+esc(schemaInfo && schemaInfo.db_schema)+') is newer than this dashboard supports (v'+esc(schemaInfo && schemaInfo.cli_schema)+'). Update the project-management-office plugin to keep viewing live data.</span></div>';

function renderViewError(err){
  if(err && err.code === 'schema_newer'){
    schemaNewer = true;
    schemaInfo = err.body || {};
    renderBanners();
  }
  if(err && err.code === 'db_missing'){
    viewEl.innerHTML = emptyPanel('document-bullet-list', 'The central database does not exist yet. Start a session in a managed project to populate Control Tower.', 'Check again', 'refresh');
    return;
  }
  var msg = (err && err.body && err.body.message) || (err && err.message) || 'Unknown error.';
  var code = (err && err.code) || (err && err.status) || '';
  viewEl.innerHTML = '<div class="obs-panel"><div class="obs-empty">'+icon('warning','icon-24 danger')+'<p>This view could not load'+(code ? ' ('+esc(String(code))+')' : '')+': '+esc(msg)+'.</p><button class="obs-btn" type="button" data-action="retry">'+icon('arrow-sync')+'Retry</button></div></div>';
}

function renderOverview(data){
  var projects = data.projects;
  var totalActive = 0, totalWaiting = 0, totalFindings = 0, totalDangling = 0;
  var teamSet = new Set();
  projects.forEach(function(p){
    totalActive += (p.work_order_counts.running || 0) + (p.work_order_counts.waiting_gate || 0);
    totalWaiting += (p.work_order_counts.waiting_gate || 0);
    totalFindings += p.open_findings;
    totalDangling += p.active_work_orders.filter(function(w){ return w.dangling; }).length;
    p.teams.forEach(function(t){ teamSet.add(t); });
  });
  var subParts = [];
  if(totalWaiting) subParts.push(totalWaiting+' waiting on a human gate');
  if(totalDangling) subParts.push(totalDangling+' dangling, flagged for attention');
  var heroSub = subParts.length ? subParts.join(' - ') : 'All active work orders are progressing normally.';
  var html = '<div class="obs-hero">'
    + '<div><div class="obs-hero-label">Active work orders</div><div class="obs-hero-num tnum">'+totalActive+'</div><div class="obs-hero-sub">'+esc(heroSub)+'</div></div>'
    + '<div class="obs-mini-kpis">'

    + '<div class="obs-mini-kpi"><div class="lbl">'+icon('shield-task')+'Waiting approval</div><div class="val tnum">'+totalWaiting+'</div></div>'
    + '<div class="obs-mini-kpi"><div class="lbl">'+icon('warning')+'Open findings</div><div class="val tnum">'+totalFindings+'</div></div>'
    + '<div class="obs-mini-kpi"><div class="lbl">'+icon('people-team')+'Teams</div><div class="val tnum">'+teamSet.size+'</div></div>'
    + '</div></div>';
  if(!projects.length){
    html += emptyPanel('board', 'No projects are registered in the PMO yet. Register one from the CLI to start seeing activity here.', 'Refresh', 'refresh');
  } else {
    html += projects.map(projectOverviewCard).join('');
  }
  viewEl.innerHTML = html;
}

    html += '<div class="obs-panel"><div class="obs-panel-head"><h3>Open questions</h3><span class="obs-count">'+d.open_questions.filter(function(q){ return q.status === 'open'; }).length+' open</span></div>'+openQuestionsList(d.open_questions)+'</div>';
    viewEl.innerHTML = html;
  }).catch(function(err){
    if(token !== renderToken) return;
    renderViewError(err);
  });
}

/* ---------- Work orders ---------- */
function viewWorkOrdersList(key, token){
  renderLoadingShell(['Work orders']);
  API.workOrders().then(function(data){
    if(token !== renderToken) return;
    var wos = data.work_orders;
    if(!wos.length){
      viewEl.innerHTML = emptyPanel('clipboard-task-list-ltr', 'No work orders have been created yet.', 'Refresh', 'refresh');
      return;
    }
    viewEl.innerHTML = '<div class="obs-panel"><div class="obs-panel-head"><h3>Work orders</h3><span class="obs-count">'+wos.length+'</span></div>'+wos.map(function(w){ return woRow(w, true); }).join('')+'</div>';
  }).catch(function(err){
    if(token !== renderToken) return;
    renderViewError(err);
  });
}
function viewWorkOrderDetail(key, token){
  renderLoadingShell(['Work order '+key]);
  API.workOrder(key).then(function(d){
    if(token !== renderToken) return;
    var html = '<div class="obs-crumb"><a href="#/work_orders">Work orders</a> / '+esc(d.work_order_key)+'</div>'
      + '<div class="obs-page-head"><h1>'+esc(d.work_order_key)+'</h1>'
      + '<div class="obs-page-sub">'+statusPill(d.status)+(d.dangling ? '<span class="obs-dangling">'+icon('alert')+'Dangling</span>' : '')
      + '<a href="#/project/'+encodeURIComponent(d.project_key)+'">'+esc(d.project_key)+'</a>'
      + (d.story ? ' - '+esc(d.story.external_id)+' '+esc(d.story.title) : '')+'</div>'
      + '<p class="obs-request">'+esc(d.request)+'</p></div>'
      + '<div class="obs-panel"><div class="obs-panel-head"><h3>Steps</h3><span class="obs-count">'+d.steps_done+'/'+d.steps_total+' done</span></div>'+stepDetailRows(d.steps, d.current_step)+'</div>'
      + '<div class="obs-split">'
      + '<div class="obs-panel"><div class="obs-panel-head"><h3>Gates</h3><span class="obs-count">'+d.gates.length+'</span></div>'+gatesTable(d.gates)+'</div>'
      + '<div class="obs-panel"><div class="obs-panel-head"><h3>Ownership</h3><span class="obs-count">'+d.ownership.length+'</span></div>'+ownershipList(d.ownership)+'</div>'
      + '</div>'
      + '<div class="obs-panel"><div class="obs-panel-head"><h3>Findings</h3><span class="obs-count">'+d.findings.filter(function(f){ return f.status === 'open'; }).length+' open</span></div>'+findingsRows(d.findings)+'</div>'
      + '<div class="obs-split">'
      + '<div class="obs-panel"><div class="obs-panel-head"><h3>Coverage</h3><span class="obs-count">'+d.coverage.length+'</span></div>'+coverageTable(d.coverage)+'</div>'
      + '<div class="obs-panel"><div class="obs-panel-head"><h3>Budgets</h3><span class="obs-count">'+d.budgets.length+'</span></div>'+budgetsTable(d.budgets)+'</div>'
      + '</div>'
      + '<div class="obs-panel"><div class="obs-panel-head"><h3>Role bindings</h3></div>'+bindingsList(d.bindings)+'</div>'
      + '<div class="obs-panel"><div class="obs-panel-head"><h3>Tasks</h3><span class="obs-count">'+d.tasks.length+'</span></div>'+attemptsTable(d.tasks)+'</div>'
      + '<div class="obs-panel"><div class="obs-panel-head"><h3>Events</h3><span class="obs-count">latest '+d.events.length+'</span></div>'+(d.events.length ? d.events.map(eventRow).join('') : emptyInline('No events recorded yet.'))+'</div>';
    viewEl.innerHTML = html;
  }).catch(function(err){
    if(token !== renderToken) return;
    renderViewError(err);
  });
}

/* ---------- Catalog ---------- */
function viewCatalog(key, token){
  renderLoadingShell(['Catalog']);
  API.catalog().then(function(data){
    if(token !== renderToken) return;
    var html = '';
    if(data.errors && data.errors.length){
      html += '<div class="obs-banner warn">'+icon('warning')+'<span>'+data.errors.map(esc).join('; ')+'</span></div>';
    }
    if(!data.teams.length){
      html += emptyPanel('people-team', 'No team plugins are installed or in use yet.', 'Refresh', 'refresh');
    } else {
      html += data.teams.map(teamCard).join('');
    }
    viewEl.innerHTML = html;
  }).catch(function(err){
    if(token !== renderToken) return;
    renderViewError(err);
  });
}

/* ---------- Ledger ---------- */
function viewLedgerPicker(key, token){
  renderLoadingShell(['Ledger']);
  API.overview().then(function(data){
    if(token !== renderToken) return;
    var projects = data.projects;
    if(!projects.length){
      viewEl.innerHTML = emptyPanel('shield-task', 'No projects are registered yet.', 'Refresh', 'refresh');

      + projects.map(function(p){
          return '<a class="obs-list-row obs-link-row" href="#/ledger/'+encodeURIComponent(p.project_key)+'">'+icon('shield-task')+'<span>'+esc(p.name)+' <span class="obs-fg-subtle">('+esc(p.project_key)+')</span></span></a>';
        }).join('')
      + '</div>';
  }).catch(function(err){
    if(token !== renderToken) return;

function viewLedger(key, token){
  renderLoadingShell(['Ledger - '+key]);
  API.ledger(key).then(function(data){
    if(token !== renderToken) return;
    viewEl.innerHTML = '<div class="obs-crumb"><a href="#/ledger">Ledger</a> / '+esc(key)+'</div>' + ledgerTable(data.rows);
  }).catch(function(err){
    if(token !== renderToken) return;
    renderViewError(err);

}

/* ---------- Events ---------- */
var eventsState = null;
function renderEventsView(){
  var items = eventsState.items.slice().reverse();
  var filterText = eventsState.filter.trim().toLowerCase();
  var filtered = filterText ? items.filter(function(e){ return (e.action+' '+e.actor).toLowerCase().indexOf(filterText) !== -1; }) : items;
  var scopeLabel = eventsState.key ? ('Scoped to project '+esc(eventsState.key)) : 'All projects';
  var html = '<div class="obs-panel">'
    + '<div class="obs-panel-head"><h3>Audit events</h3><span class="obs-count">'+scopeLabel+(eventsState.key ? ' - <a href="#/events">view all</a>' : '')+'</span></div>'
    + '<div class="obs-events-toolbar"><label class="obs-events-filter">'+icon('filter')+'<input type="text" id="events-filter-input" aria-label="Filter events by actor or action" placeholder="Filter by actor or action" value="'+esc(eventsState.filter)+'"></label></div>'
    + (filtered.length ? filtered.map(eventRow).join('') : emptyInline('No events match this view.'))
    + (!eventsState.done ? '<div class="obs-load-more"><button class="obs-btn" type="button" data-action="load-more-events">'+icon('history')+'Load more</button></div>' : '')
    + '</div>';
  viewEl.innerHTML = html;
  var input = document.getElementById('events-filter-input');
  if(input) input.addEventListener('input', onEventsFilterInput);
}
function onEventsFilterInput(e){
  var val = e.target.value;
  var pos = e.target.selectionStart;
  eventsState.filter = val;
  renderEventsView();
  var input2 = document.getElementById('events-filter-input');
  if(input2){ input2.focus(); input2.setSelectionRange(pos, pos); }
}
function loadEventsPage(token){
  API.events(eventsState.sinceId, eventsState.key, 100).then(function(data){
    if(token !== renderToken) return;
    if(data.events.length){
      eventsState.items = eventsState.items.concat(data.events);
      eventsState.sinceId = data.events[data.events.length-1].id;
    }
    eventsState.done = data.events.length < 100;
    renderEventsView();
  }).catch(function(err){
    if(token !== renderToken) return;
    renderViewError(err);
  });
}
function viewEvents(key, token){
  eventsState = {key: key || null, sinceId: 0, items: [], filter: '', done: false};
  renderLoadingShell(['Audit events']);
  loadEventsPage(token);
}

/* ---------- router ---------- */
var ROUTE_TABLE = {
  overview: {section:'overview', render: viewOverview},
  projects: {section:'projects', render: viewProjectsList},
  project: {section:'projects', render: viewProjectBoard},
  work_orders: {section:'work_orders', render: viewWorkOrdersList},
  wo: {section:'work_orders', render: viewWorkOrderDetail},
  catalog: {section:'catalog', render: viewCatalog},
  ledger: {section:'ledger', render: function(key, token){ return key ? viewLedger(key, token) : viewLedgerPicker(key, token); }},
  events: {section:'events', render: viewEvents}
};
function parseHash(){
  var h = (location.hash || '#/overview').slice(1);
  var parts = h.split('/').filter(Boolean);
  return {seg: parts[0] || 'overview', key: parts[1] ? decodeURIComponent(parts[1]) : null};
}
function updateTabs(section){
  var tabs = document.querySelectorAll('#tabs a');
  for(var i=0;i<tabs.length;i++){
    var a = tabs[i];
    var active = a.dataset.section === section;
    a.classList.toggle('active', active);
    if(active) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
    var use = a.querySelector('use');
    var filled = a.dataset.iconFilled;
    var base = a.dataset.icon;
    if(use) use.setAttribute('href', '#i-'+((active && filled) ? filled : base));
  }
}
function navigate(){
  var parsed = parseHash();
  var entry = ROUTE_TABLE[parsed.seg] || ROUTE_TABLE.overview;
  var seg = ROUTE_TABLE[parsed.seg] ? parsed.seg : 'overview';
  currentRoute = {seg: seg, key: parsed.key};
  updateTabs(entry.section);
  renderToken++;
  entry.render(parsed.key, renderToken);
}
function reloadCurrentView(){
  if(!currentRoute) return;
  var entry = ROUTE_TABLE[currentRoute.seg];
  renderToken++;
  entry.render(currentRoute.key, renderToken);
}
function autoReload(){
  if(schemaNewer) return;
  reloadCurrentView();
}

/* ---------- theme ---------- */
function currentTheme(){
  var attr = document.documentElement.getAttribute('data-theme');
  return (attr === 'light' || attr === 'dark') ? attr : 'dark';
}
function updateThemeToggleUI(){
  var t = currentTheme();
  var btn = document.getElementById('theme-toggle');
  var use = document.getElementById('theme-icon-use');
  btn.setAttribute('aria-pressed', t === 'light' ? 'true' : 'false');
  use.setAttribute('href', t === 'light' ? '#i-weather-sunny' : '#i-weather-moon');
}
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('pmo-theme', t); }catch(e){}
  updateThemeToggleUI();
}
function initTheme(){
  var saved = null;
  try{ saved = localStorage.getItem('pmo-theme'); }catch(e){}
  if(saved === 'light' || saved === 'dark'){
    document.documentElement.setAttribute('data-theme', saved);
  } else {
    var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    if(prefersLight) document.documentElement.setAttribute('data-theme', 'light');
  }
  updateThemeToggleUI();
  document.getElementById('theme-toggle').addEventListener('click', function(){
    setTheme(currentTheme() === 'light' ? 'dark' : 'light');
  });
}

/* ---------- system line (status parity: db path, versions) ---------- */
var syslineEl = document.getElementById('sysline');
function renderSysline(head){
  if(!syslineEl || !head) return;
  var parts = ['DB <span class="tnum">'+esc(head.db_path || '')+'</span>'
    + (head.db_present === false ? ' (not created yet)' : '')];
  if(head.cli_version) parts.push('CLI <span class="tnum">'+esc(head.cli_version)+'</span>');
  if(head.schema_version !== null && head.schema_version !== undefined)
    parts.push('schema <span class="tnum">'+esc(String(head.schema_version))+'</span>');
  syslineEl.innerHTML = parts.join(' &middot; ');
}

/* ---------- head poller ---------- */
var headInFlight = null;
var lastHeadId = null;
function pollHead(){
  if(document.hidden) return Promise.resolve();
  if(headInFlight) return headInFlight;
  headInFlight = API.head().then(function(data){
    renderSysline(data);
    if(lastHeadId !== null && data.head_id !== lastHeadId){
      lastHeadId = data.head_id;
      autoReload();
    } else {
      lastHeadId = data.head_id;
    }
  }).catch(function(){ /* transient; next tick retries */ }).finally(function(){ headInFlight = null; });
  return headInFlight;
}

/* ---------- init ---------- */
viewEl.addEventListener('click', function(e){
  var t = e.target.closest('[data-action]');
  if(!t) return;
  var action = t.getAttribute('data-action');
  if(action === 'retry') reloadCurrentView();
  else if(action === 'refresh') pollHead().then(reloadCurrentView);
  else if(action === 'load-more-events') loadEventsPage(renderToken);
});
window.addEventListener('hashchange', navigate);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) pollHead(); });
document.addEventListener('DOMContentLoaded', function(){
  initTheme();
  navigate();
  pollHead();
  setInterval(pollHead, 2000);
});

})();

</script>
