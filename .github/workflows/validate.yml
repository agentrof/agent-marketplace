name: validate

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact trusted candidate to validate or match to prior evidence
        type: string
        required: true
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-validation
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changeset:
    if: >-
      github.event_name == 'pull_request' &&
      !(
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.ref == 'release/stable' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - name: Require a release-impact declaration
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/release.py check-pr --base "$BASE_SHA"

  release-pr-policy:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'release/stable' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - name: Verify the deterministic release branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/stable:refs/remotes/origin/stable" \
            "+refs/heads/release/stable:refs/remotes/origin/release/stable"
          test "$(git rev-parse refs/remotes/origin/release/stable)" = "$HEAD_SHA"
          python3 tools/release.py verify-release-pr \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --stable-sha "$(git rev-parse refs/remotes/origin/stable)"

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_tests: ${{ steps.plan.outputs.has_tests }}
      apple_launcher: ${{ steps.plan.outputs.apple_launcher }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Select coverage and verify prior validation evidence
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: >-
          python3 tools/ci_plan.py
          --output-directory "$RUNNER_TEMP/ci-plan"
          --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-plan/*.json
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  deterministic-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Validate contracts, release metadata, counts and generated distributions
        run: make static-check

  test-shards:
    name: tests (${{ matrix.lane }}, ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.has_tests == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exercise the Apple system Python launcher
        if: matrix.apple_launcher == true
        env:
          AGENT_MARKETPLACE_REQUIRE_APPLE_PYTHON3: "1"
          DEVELOPER_DIR: ""
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
          SDKROOT: ""
          TOOLCHAINS: ""
        run: >-
          /usr/bin/python3 -m unittest
          tools.tests.test_vault_hook.VaultHookShellContractTests.test_system_macos_python3_launcher_is_accepted
          tools.tests.test_vault_hook.VaultHookShellContractTests.test_issue_77_bare_python_cmd_preserves_attested_codex_result
          tools.tests.test_vault_hook.VaultHookShellContractTests.test_bare_python_candidate_with_invalid_result_is_restored
          tools.tests.test_vault_hook.VaultHookShellContractTests.test_bare_render_cannot_publish_a_different_valid_transition
          tools.tests.test_vault_hook.VaultHookShellContractTests.test_bare_render_with_forged_registry_is_restored
          tools.tests.test_vault_hook.VaultHookShellContractTests.test_issue_77_bare_init_has_an_exact_attested_delta
          tools.tests.test_vault_hook.VaultHookShellContractTests.test_issue_77_bare_init_preserves_real_codex_draft
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-plan
      - name: Run the exact selected test partition
        env:
          CI_LANE: ${{ matrix.lane }}
          CI_SHARD: ${{ matrix.shard }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python tools/ci_tests.py run
          --plan "$RUNNER_TEMP/ci-plan/ci-plan.json"
          --lane "$CI_LANE" --shard "$CI_SHARD"
          --report "$RUNNER_TEMP/test-report.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: ci-report-${{ github.run_id }}-${{ matrix.lane }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-report.json
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  compatibility:
    name: compatibility (${{ matrix.os }}, Python ${{ matrix.python }})
    if: always()
    needs: [plan, test-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: macos-latest
            python: "3.x"
    steps:
      - name: Require the selected platform test jobs
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          HAS_TESTS: ${{ needs.plan.outputs.has_tests }}
          TEST_RESULT: ${{ needs.test-shards.result }}
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = success
          if [ "$HAS_TESTS" = true ]; then
            test "$TEST_RESULT" = success
          else
            test "$HAS_TESTS" = false
            test "$TEST_RESULT" = skipped
          fi

  check:
    name: check
    if: always()
    needs:
      - changeset
      - release-pr-policy
      - plan
      - test-shards
      - deterministic-check
      - compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every validation result
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          CHANGESET_RESULT: ${{ needs.changeset.result }}
          RELEASE_POLICY_RESULT: ${{ needs.release-pr-policy.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          HAS_TESTS: ${{ needs.plan.outputs.has_tests }}
          TEST_RESULT: ${{ needs.test-shards.result }}
          DETERMINISTIC_RESULT: ${{ needs.deterministic-check.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = success
          test "$DETERMINISTIC_RESULT" = success
          test "$COMPATIBILITY_RESULT" = success
          if [ "$HAS_TESTS" = true ]; then
            test "$TEST_RESULT" = success
          else
            test "$HAS_TESTS" = false
            test "$TEST_RESULT" = skipped
          fi
          expected_changeset=skipped
          expected_release_policy=skipped
          if [ "$EVENT_NAME" = pull_request ]; then
            if [ "$BASE_REF" = main ] &&
               [ "$HEAD_REF" = release/stable ] &&
               [ "$HEAD_REPOSITORY" = "$REPOSITORY" ]; then
              expected_release_policy=success
            else
              expected_changeset=success
            fi
          fi
          test "$CHANGESET_RESULT" = "$expected_changeset"
          test "$RELEASE_POLICY_RESULT" = "$expected_release_policy"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.plan.outputs.has_tests == 'true'
        with:
          pattern: ci-report-${{ github.run_id }}-*
          path: ${{ runner.temp }}/ci-reports
      - name: Verify complete test coverage
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-reports"
          python3 tools/ci_tests.py verify-reports \
            --plan "$RUNNER_TEMP/ci-plan/ci-plan.json" \
            --reports "$RUNNER_TEMP/ci-reports" \
            --output "$RUNNER_TEMP/ci-durations.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-durations-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-durations.json
          if-no-files-found: error
          retention-days: 7
      - name: Record reusable validation evidence
        if: >-
          github.event_name != 'schedule' &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.head.repo.full_name == github.repository))
        env:
          GH_TOKEN: ${{ github.token }}
          CI_MODE: ${{ needs.plan.outputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-reports"
          args=()
          if [ "$CI_MODE" = reuse ] || [ "$CI_MODE" = release ]; then
            args+=(--inherited "$RUNNER_TEMP/ci-plan/ci-reuse.json")
          fi
          python3 tools/ci_evidence.py create \
            --candidate-sha "$(git rev-parse HEAD)" \
            --plan "$RUNNER_TEMP/ci-plan/ci-plan.json" \
            --reports "$RUNNER_TEMP/ci-reports" \
            --output "$RUNNER_TEMP/ci-evidence.json" "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: >-
          github.event_name != 'schedule' &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.head.repo.full_name == github.repository))
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence.json
          if-no-files-found: error
          retention-days: 7
